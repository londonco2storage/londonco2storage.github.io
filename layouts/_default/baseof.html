<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
{{- partial "head.html" . -}}
<body>
    <div class="base-container">
        <div class="base-header shadow-sm">
            {{- partial "header.html" . -}}
        </div>

        <main id="content" class="base-content">
            {{- block "main" . }}{{- end }}
        </main>

        <div class="base-footer mt-4">
            {{- partial "footer.html" . -}}
        </div>

    </div>
    {{- partial "scripts.html" . -}}
</body>
</html>
