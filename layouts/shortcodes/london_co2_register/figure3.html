{{- $reg := site.Data.register }}
<div class="ichart-panel">
    <div class="ichart-title">Figure 3 &mdash; Annual CO&#8322; storage by storage type</div>
    <div class="ichart-sub">Geological Storage with Oil Recovery vs Geological Storage, 1996&ndash;2025
        &middot; million tonnes per year &middot; data release {{ $reg.meta.release }}</div>
    <div id="figure3-tooltip" class="ichart-tooltip"></div>
    <svg id="figure3-svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" role="img"
        aria-label="Annual CO2 storage by storage type, Geological Storage with Oil Recovery versus Geological Storage"></svg>
</div>
<script type="module">
const f3Data = [{"year": 1996, "eor": 0.0, "ds": 0.07, "eorN": 0, "dsN": 1}, {"year": 1997, "eor": 0.0, "ds": 0.665, "eorN": 0, "dsN": 1}, {"year": 1998, "eor": 0.0, "ds": 0.842, "eorN": 0, "dsN": 1}, {"year": 1999, "eor": 0.0, "ds": 0.971, "eorN": 0, "dsN": 1}, {"year": 2000, "eor": 1.5556, "ds": 0.933, "eorN": 1, "dsN": 1}, {"year": 2001, "eor": 1.5556, "ds": 1.009, "eorN": 1, "dsN": 1}, {"year": 2002, "eor": 1.5556, "ds": 0.955, "eorN": 1, "dsN": 1}, {"year": 2003, "eor": 1.5556, "ds": 0.914, "eorN": 1, "dsN": 1}, {"year": 2004, "eor": 1.5556, "ds": 1.2325, "eorN": 1, "dsN": 2}, {"year": 2005, "eor": 1.5785, "ds": 1.3405, "eorN": 2, "dsN": 2}, {"year": 2006, "eor": 1.8485, "ds": 1.3025, "eorN": 3, "dsN": 2}, {"year": 2007, "eor": 2.0029, "ds": 1.4035, "eorN": 5, "dsN": 2}, {"year": 2008, "eor": 6.6986, "ds": 1.5301, "eorN": 7, "dsN": 4}, {"year": 2009, "eor": 8.6974, "ds": 1.6789, "eorN": 8, "dsN": 4}, {"year": 2010, "eor": 8.8945, "ds": 1.6855, "eorN": 7, "dsN": 3}, {"year": 2011, "eor": 9.1145, "ds": 1.9615, "eorN": 7, "dsN": 6}, {"year": 2012, "eor": 6.2861, "ds": 1.8236, "eorN": 8, "dsN": 7}, {"year": 2013, "eor": 10.0656, "ds": 1.663, "eorN": 15, "dsN": 6}, {"year": 2014, "eor": 11.1466, "ds": 1.7676, "eorN": 16, "dsN": 7}, {"year": 2015, "eor": 14.7372, "ds": 1.982, "eorN": 18, "dsN": 9}, {"year": 2016, "eor": 18.2059, "ds": 2.7814, "eorN": 18, "dsN": 9}, {"year": 2017, "eor": 20.7311, "ds": 3.0606, "eorN": 18, "dsN": 7}, {"year": 2018, "eor": 22.0094, "ds": 3.4149, "eorN": 18, "dsN": 8}, {"year": 2019, "eor": 20.2214, "ds": 6.6585, "eorN": 18, "dsN": 10}, {"year": 2020, "eor": 22.2728, "ds": 5.7251, "eorN": 19, "dsN": 10}, {"year": 2021, "eor": 24.0171, "ds": 4.5071, "eorN": 20, "dsN": 10}, {"year": 2022, "eor": 27.1276, "ds": 4.9284, "eorN": 21, "dsN": 14}, {"year": 2023, "eor": 36.189, "ds": 5.5349, "eorN": 23, "dsN": 17}, {"year": 2024, "eor": 36.1675, "ds": 7.4159, "eorN": 25, "dsN": 24}, {"year": 2025, "eor": 31.368, "ds": 4.7977, "eorN": 12, "dsN": 17}];
const M = { t: 18, r: 16, b: 84, l: 62 }, W = 1000, H = 560;
const iw = W - M.l - M.r, ih = H - M.t - M.b;
const COLORS = { eor: '#17756F', ds: '#8E9BA6' };
const LABELS = { eor: 'Geological Storage with Oil Recovery', ds: 'Geological Storage' };
const svg = d3.select('#figure3-svg');
const defs = svg.append('defs');
const hatch = defs.append('pattern').attr('id', 'f3hatch').attr('patternUnits', 'userSpaceOnUse')
    .attr('width', 7).attr('height', 7).attr('patternTransform', 'rotate(45)');
hatch.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 7)
    .attr('stroke', '#ffffff').attr('stroke-width', 2.2);
const g = svg.append('g').attr('transform', `translate(${M.l},${M.t})`);
const years = f3Data.map(d => d.year);
const x = d3.scaleBand().domain(years).range([0, iw]).paddingInner(0.22).paddingOuter(0.08);
const y = d3.scaleLinear().domain([0, 46]).range([ih, 0]);
g.append('rect').attr('x', x(2025) - x.step() * 0.11).attr('y', 0)
    .attr('width', x.step()).attr('height', ih).attr('fill', '#eef1f4');
g.append('g').attr('transform', `translate(0,${ih})`)
    .call(d3.axisBottom(x).tickSizeOuter(0))
    .call(s => {
        s.select('.domain').attr('stroke', '#8b98a2');
        s.selectAll('text').attr('font-size', 11.5)
            .attr('transform', 'rotate(-48)').attr('text-anchor', 'end')
            .attr('dx', '-0.6em').attr('dy', '0.5em');
    });
g.append('g').call(d3.axisLeft(y).tickValues(d3.range(0, 46, 5)).tickSizeOuter(0))
    .call(s => { s.selectAll('text').attr('font-size', 12); s.select('.domain').attr('stroke', '#8b98a2'); });
g.append('text').attr('transform', 'rotate(-90)').attr('x', -ih / 2).attr('y', -44).attr('text-anchor', 'middle')
    .attr('font-size', 13).attr('fill', '#142f40').text('Amount of CO₂ Stored (million tonnes)');
f3Data.forEach(d => {
    const x0 = x(d.year), bw = x.bandwidth();
    const segs = [['eor', 0, d.eor], ['ds', d.eor, d.ds]];
    segs.forEach(([k, base, v]) => {
        g.append('rect').attr('x', x0).attr('y', y(base + v)).attr('width', bw)
            .attr('height', y(base) - y(base + v)).attr('fill', COLORS[k])
            .attr('stroke', '#ffffff').attr('stroke-width', 0.5);
        if (d.year === 2025) {
            g.append('rect').attr('x', x0).attr('y', y(base + v)).attr('width', bw)
                .attr('height', y(base) - y(base + v)).attr('fill', 'url(#f3hatch)').attr('opacity', 0.85);
        }
    });
});
const leg = g.append('g').attr('transform', 'translate(10,6)');
const legendRows = [
    { fill: COLORS.eor, label: LABELS.eor },
    { fill: COLORS.ds, label: LABELS.ds },
    { fill: 'url(#f3hatchLegend)', label: '2025: incomplete reporting to date', box: true }
];
const hatchL = defs.append('pattern').attr('id', 'f3hatchLegend').attr('patternUnits', 'userSpaceOnUse')
    .attr('width', 6).attr('height', 6).attr('patternTransform', 'rotate(45)');
hatchL.append('rect').attr('width', 6).attr('height', 6).attr('fill', '#ffffff');
hatchL.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 6)
    .attr('stroke', '#526773').attr('stroke-width', 1.4);
legendRows.forEach((r, i) => {
    const row = leg.append('g').attr('transform', `translate(0,${i * 24})`);
    row.append('rect').attr('width', 20).attr('height', 13).attr('y', 1).attr('fill', r.fill)
        .attr('stroke', r.box ? '#526773' : 'none').attr('stroke-width', r.box ? 1 : 0);
    row.append('text').attr('x', 28).attr('y', 12).attr('font-size', 13).attr('fill', '#142f40').text(r.label);
});
const tip = d3.select('#figure3-tooltip');
const f1 = d3.format('.1f');
const hl = g.append('rect').attr('y', 0).attr('height', ih).attr('width', x.step())
    .attr('fill', 'none').attr('stroke', '#526773').attr('stroke-dasharray', '3,3').style('visibility', 'hidden');
svg.append('rect').attr('x', M.l).attr('y', M.t).attr('width', iw).attr('height', ih)
    .attr('fill', 'transparent')
    .on('mousemove', (event) => {
        const [mx] = d3.pointer(event, g.node());
        const idx = Math.max(0, Math.min(years.length - 1, Math.floor(mx / x.step())));
        const d = f3Data[idx];
        hl.attr('x', x(d.year) - x.step() * 0.11).style('visibility', 'visible');
        tip.style('visibility', 'visible')
            .html(`<strong>${d.year}</strong>${d.year === 2025 ? ' (incomplete)' : ''}<br>` +
                `<span style="color:#17756F">&#9632;</span> Geological Storage with Oil Recovery: ${f1(d.eor)} Mt &middot; ${d.eorN} project${d.eorN === 1 ? '' : 's'}<br>` +
                `<span style="color:#8E9BA6">&#9632;</span> Geological Storage: ${f1(d.ds)} Mt &middot; ${d.dsN} project${d.dsN === 1 ? '' : 's'}<br>` +
                `Total: ${f1(d.eor + d.ds)} Mt`)
            .style('top', (event.pageY - 12) + 'px').style('left', (event.pageX + 14) + 'px');
    })
    .on('mouseleave', () => { tip.style('visibility', 'hidden'); hl.style('visibility', 'hidden'); });
</script>
