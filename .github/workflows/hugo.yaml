# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Refresh baked visitor statistics daily
  schedule:
    - cron: '17 5 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.141.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Bake visitor statistics
        run: |
          TOKEN=$(grep -o 'goatcounter_token = "[^"]*"' data/register.toml | cut -d'"' -f2)
          CODE=$(grep -o '^goatcounter = "[^"]*"' data/register.toml | cut -d'"' -f2)
          END=$(date -u -d '+1 day' +%F)
          if [ -n "$TOKEN" ] && [ -n "$CODE" ]; then
            curl -sf "https://$CODE.goatcounter.com/api/v0/stats/hits?start=2025-01-01&end=$END&limit=100" \
              -H "Authorization: Bearer $TOKEN" -o /tmp/hits.json || echo '{}' > /tmp/hits.json
            curl -sf "https://$CODE.goatcounter.com/api/v0/stats/locations?start=2025-01-01&end=$END" \
              -H "Authorization: Bearer $TOKEN" -o /tmp/loc.json || echo '{}' > /tmp/loc.json
            jq -n --slurpfile h /tmp/hits.json --slurpfile l /tmp/loc.json \
              '{generated: (now | strftime("%Y-%m-%d %H:%M UTC")),
                hits: [($h[0].hits // [])[] | {path, count}],
                countries: [($l[0].stats // [])[] | {name, count}]}' \
              > data/livestats.json || true
          fi
          head -c 400 data/livestats.json || true
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
